  const originalSetView=typeof setView==="function"?setView:null;
  function libPath(name){return DATA_BASE+"/"+name}
  function readLibState(){
    try{const v=JSON.parse(localStorage.getItem(LIB_STORAGE));if(v&&typeof v==="object")return v}catch(e){}
    return {schema:"guitarfakebook.library-session.v1",favoriteIds:[],edits:{},artistDen:Array.isArray(state.artistDen)?state.artistDen:[],fontSize:state.fontSize||18,activeId:""};
  }
  let libState=readLibState();
  if(!Array.isArray(libState.favoriteIds))libState.favoriteIds=[];
  if(!libState.edits||typeof libState.edits!=="object")libState.edits={};
  function persistLib(){
    libState.fontSize=state.fontSize;
    libState.artistDen=state.artistDen;
    localStorage.setItem(LIB_STORAGE,JSON.stringify(libState));
  }
  state.songs=[];
  activeId="";
  function toUiSong(payload,favorite){
    const edit=libState.edits[payload.id]||{};
    return {
      id:payload.id,
      title:edit.title||payload.displayTitle||payload.title,
      artist:edit.artist||payload.artist,
      difficulty:payload.difficulty||"",
      tuning:payload.tuning||"",
      key:payload.key||"",
      capo:payload.capo||"",
      rights:edit.rights||"Not documented",
      source:edit.source||((payload.source&&payload.source.format||"")+ " " + String(payload.source&&payload.source.sha256||payload.id).slice(0,12)),
      favorite:!!favorite,
      content:edit.content||payload.content||"",
      diagrams:payload.diagrams||{}
    };
  }
  async function fetchLibrarySong(id){
    const res=await fetch(libPath("songs/"+id+".json"));
    if(!res.ok)throw new Error("missing");
    return res.json();
  }
  function rememberSong(song){
    const idx=state.songs.findIndex(s=>s.id===song.id);
    if(idx>=0)state.songs[idx]=song;else state.songs.push(song);
    state.songs=state.songs.filter(s=>s.favorite||s.id===activeId||String(s.id).startsWith("artist-den:"));
  }
  getShapes=function(chord){
    const s=originalCurrent();
    if(s&&s.diagrams&&transpose===0){
      const raw=String(chord||"");
      const entry=s.diagrams[raw]||s.diagrams[raw.replace(/♯/g,"#").replace(/♭/g,"b")]||s.diagrams[raw.replace(/#/g,"♯").replace(/b/g,"♭")];
      if(entry&&Array.isArray(entry.catalog)&&entry.catalog.length)return entry.catalog;
      return [];
    }
    return originalGetShapes(chord);
  };
  current=function(){
    if(typeof gfbView!=="undefined"&&gfbView==="den")return originalCurrent();
    return state.songs.find(s=>s.id===activeId&&!String(s.id).startsWith("artist-den:"))||null;
  };
  function renderLibraryLanding(){
    els.songList.innerHTML=libraryLoadError?'<div class="viewError">'+escapeHtml(libraryLoadError)+'</div>':'<div class="empty">Loading the QA-0 Library…</div>';
    els.mobileSongs.innerHTML="";
    els.libraryCount.textContent=libraryLoadError?"Library unavailable":"Loading 10 songs…";
    $("#sideTitle").textContent="QA-0 Library";
    els.title.textContent="GuitarFakeBook";
    els.artist.textContent=libraryLoadError?"The real-song loader needs attention":"Loading a real control song";
    els.meta.innerHTML="";
    els.rights.textContent=libraryLoadError?"No demo or fixture fallback was used":(libraryReady?(libraryIndex.length+" QA-0 chord sheets"):"Loading library index…");
    els.rail.innerHTML="";
    hideChordPopover();
    els.sheet.innerHTML=libraryLoadError?'<div class="viewError"><h2>QA-0 Library unavailable</h2><p>'+escapeHtml(libraryLoadError)+'</p></div>':'<div class="denEmpty"><h2>Loading QA-0 songs</h2><p>One real song will open automatically and all ten controls will appear for navigation.</p></div>';
  }
  function searchHits(q){
    const needle=q.toLowerCase();
    const hits=[];
    for(const row of libraryIndex){
      const blob=(row.displayTitle+" "+row.title+" "+row.artist).toLowerCase();
      if(blob.includes(needle))hits.push(row);
      if(hits.length>=SEARCH_LIMIT)break;
    }
    return hits;
  }
  renderLibrary=function(){
    if(typeof gfbView!=="undefined"&&gfbView==="den")return originalRenderLibrary();
    const q=els.search.value.trim();
    $("#sideTitle").textContent="QA-0 Library";
    els.songList.innerHTML="";
    els.mobileSongs.innerHTML="";
    const favorites=state.songs.filter(s=>s.favorite&&!String(s.id).startsWith("artist-den:"));
    const list=q?searchHits(q):libraryIndex.slice(0,SEARCH_LIMIT);
    list.forEach(row=>{
      const id=row.id;
      const title=row.displayTitle||row.title;
      const artist=row.artist||"";
      const isFav=libState.favoriteIds.includes(id)||!!row.favorite;
      const b=document.createElement("button");
      b.type="button";
      b.className="songItem"+(id===activeId?" active":"");
      b.innerHTML='<div class="songTitle">'+(isFav?"★ ":"")+escapeHtml(title)+'</div><div class="songArtist">'+escapeHtml(artist)+"</div>";
      b.setAttribute("aria-label","Open "+title+" by "+artist);
      b.onclick=()=>selectSong(id);
      if(!q&&isFav){
        const favoriteRow=document.createElement("div");favoriteRow.className="favoriteRow";favoriteRow.append(b);
        const remove=document.createElement("button");remove.type="button";remove.className="favoriteRemove";remove.textContent="×";
        remove.title="Remove "+title+" from favorites";remove.setAttribute("aria-label","Remove "+title+" from favorites");
        remove.onclick=e=>{e.stopPropagation();libState.favoriteIds=libState.favoriteIds.filter(x=>x!==id);const live=state.songs.find(s=>s.id===id);if(live)live.favorite=false;persistLib();render();toast("Removed from favorites")};
        favoriteRow.append(remove);els.songList.append(favoriteRow);
      }else els.songList.append(b);
      const o=document.createElement("option");o.value=id;o.textContent=title+" — "+artist;o.selected=id===activeId;els.mobileSongs.append(o);
    });
    if(!list.length)els.songList.innerHTML=libraryLoadError?'<div class="viewError">'+escapeHtml(libraryLoadError)+'</div>':(q?'<div class="empty">No songs match this search.</div>':'<div class="empty">No QA-0 songs are available.</div>');
    els.libraryCount.textContent=q?(list.length+(list.length>=SEARCH_LIMIT?"+":"")+" matches"):(list.length+" songs • "+favorites.length+"/50 favorites");
  };
  selectSong=async function(id){
    if(typeof gfbView!=="undefined"&&gfbView==="den")return originalSelectSong(id);
    if(!id){activeId="";render();return}
    try{
      libraryLoadError="";
      const payload=await fetchLibrarySong(id);
      const song=toUiSong(payload,libState.favoriteIds.includes(id));
      activeId=song.id;
      rememberSong(song);
      libState.activeId=song.id;
      persistLib();
      transpose=0;
      originalRender();
      try{history.replaceState({}, "", location.pathname+"?song="+encodeURIComponent(song.id))}catch(e){}
      window.scrollTo({top:0,behavior:"smooth"});
    }catch(err){
      libraryLoadError="The selected real song could not be loaded. No demo data was substituted.";
      toast("That real song could not be loaded");
      libState.activeId="";
      persistLib();
      activeId="";
      try{history.replaceState({}, "", location.pathname)}catch(e){}
      render();
    }
  };
  render=function(){
    if(typeof gfbView!=="undefined"&&gfbView==="den")return originalRender();
    const s=current();
    if(!s){renderLibraryLanding();renderLibrary();return}
    originalRender();
  };
  if(originalSetView){
    setView=function(view){
      gfbView=view;
      els.search.value="";
      $("#libraryViewBtn").classList.toggle("active",view==="library");
      $("#artistDenViewBtn").classList.toggle("active",view==="den");
      $("#newArtistDenSong").classList.toggle("hidden",view!=="den");
      els.search.placeholder=view==="den"?"Search your Artist's Den songs":"Search artist or song";
      if(view==="den"){
        activeId=(denSongs()[0]&&denSongs()[0].id)||"";
        originalRender();
      }else{
        activeId=libState.activeId||"";
        render();
      }
    };
  }
  const originalFav=els.fav.onclick;
  els.fav.onclick=()=>{
    if(typeof gfbView!=="undefined"&&gfbView==="den")return originalFav&&originalFav();
    const s=current();if(!s)return;
    if(!s.favorite&&libState.favoriteIds.length>=50){toast("Favorites are limited to 50 songs");return}
    s.favorite=!s.favorite;
    if(s.favorite){if(!libState.favoriteIds.includes(s.id))libState.favoriteIds.push(s.id)}
    else libState.favoriteIds=libState.favoriteIds.filter(id=>id!==s.id);
    persistLib();
    render();
    toast(s.favorite?"Added to favorites":"Removed from favorites");
  };
  const originalSave=$("#saveEdit").onclick;
  $("#saveEdit").onclick=()=>{
    if(typeof gfbView!=="undefined"&&gfbView==="den")return originalSave();
    const s=current();if(!s)return;
    s.title=$("#editSongTitle").value.trim()||"Untitled";
    s.artist=$("#editArtist").value.trim()||"Unknown artist";
    s.content=$("#editContent").value;
    s.rights=$("#editRights").value.trim();
    s.source=$("#editSource").value.trim();
    libState.edits[s.id]={title:s.title,artist:s.artist,content:s.content,rights:s.rights,source:s.source};
    persistLib();
    closeEdit();
    render();
    toast("Chord sheet saved in this browser");
  };
  $("#loginBtn").classList.add("hidden");
  $("#loginBtn").setAttribute("hidden","hidden");
  function denImportOk(data){return data&&data.schema==="guitarfakebook.artist-den.v1"&&Array.isArray(data.songs)&&data.songs.length<=50&&data.songs.every(s=>String(s.id||"").startsWith("artist-den:"))}
  function libraryImportOk(data){return data&&data.schema==="guitarfakebook.preferences.v1"&&Array.isArray(data.songs)&&data.songs.length&&data.songs.every(s=>!String(s.id||"").startsWith("artist-den:"))}
  $("#fileInput").onchange=async e=>{
    const file=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!file)return;
    const den=typeof gfbView!=="undefined"&&gfbView==="den";
    let data;
    try{data=JSON.parse(await file.text())}catch{
      toast(den?"This is not an Artist's Den file":"This is not a library preference file");
      return;
    }
    if(den){
      if(!denImportOk(data)){toast("This is not an Artist's Den file");return}
      state.artistDen=data.songs;
      activeId=denSongs()[0]?denSongs()[0].id:"";
      libState.artistDen=state.artistDen;
      persistLib();
      saveState();
      render();
      toast("Artist's Den loaded");
      return;
    }
    if(!libraryImportOk(data)){toast("This is not a library preference file");return}
    state.songs=data.songs;
    if(Number.isFinite(data.fontSize))state.fontSize=data.fontSize;
    activeId=state.songs[0].id;
    libState.favoriteIds=state.songs.filter(s=>s.favorite).map(s=>s.id).slice(0,50);
    for(const s of state.songs){
      libState.edits[s.id]={title:s.title,artist:s.artist,content:s.content,rights:s.rights,source:s.source};
    }
    libState.activeId=activeId;
    persistLib();
    saveState();
    render();
    toast("Library preferences loaded");
  };
  async function bootLibrary(){
    try{
      const res=await fetch(libPath("index.json"));
      if(!res.ok)throw new Error("index");
      const index=await res.json();
      if(!index||index.schema!=="guitarfakebook.library-index.v1"||!Array.isArray(index.songs)||index.songs.length!==INDEX_COUNT_TARGET||index.count!==INDEX_COUNT_TARGET)throw new Error("catalog");
      libraryIndex=index.songs||[];
      libraryReady=true;
      libraryLoadError="";
      if(INDEX_COUNT_TARGET!=null&&index.count!==INDEX_COUNT_TARGET)console.warn("library count",index.count);
      const params=new URLSearchParams(location.search);
      const wanted=params.get("song")||(location.hash.startsWith("#song=")?location.hash.slice(6):"");
      if(!wanted)render();
      if(libState.favoriteIds.length){
        for(const id of libState.favoriteIds.slice(0,50)){
          try{
            const payload=await fetchLibrarySong(id);
            rememberSong(toUiSong(payload,true));
          }catch(e){}
        }
      }
      const remembered=libraryIndex.some(row=>row.id===libState.activeId)?libState.activeId:"";
      const acceleratorDefault=(libraryIndex.find(row=>row.artist==="Alan Walker"&&row.title==="Lost Control")||libraryIndex[0]||{}).id||"";
      await selectSong(wanted||remembered||acceleratorDefault);
    }catch(err){
      libraryReady=false;
      libraryLoadError="The real ten-song QA-0 catalog could not be loaded. Check internet access and reload. No demo data was substituted.";
      toast("Could not load the real QA-0 catalog");
      render();
    }
  }
  renderLibraryLanding();
  bootLibrary();
})();
</script>
<script>
"use strict";

/* GFB-LB-03: embedded Index and Help views layered onto the approved UI copy. */
(function () {
  const root = document.documentElement;
  const dataBase = String(root.dataset.gfbData || "").replace(/\/+$/, "");
  const main = document.querySelector(".main");
  const indexButton = document.querySelector("#indexBtn");
  const libraryButton = document.querySelector("#libraryViewBtn");
  const denButton = document.querySelector("#artistDenViewBtn");
  const uploadButton = document.querySelector("#importBtn");
  const downloadButton = document.querySelector("#exportBtn");
  const newSongButton = document.querySelector("#newArtistDenSong");
  const toolbar = document.querySelector(".toolbar");
  const songViews = [".songHero", ".chordRail", ".sheet", ".mobileSongs"]
    .map(selector => document.querySelector(selector)).filter(Boolean);
  let indexRows = [];
  let indexLoaded = false;

  if (!main || !indexButton || !libraryButton || !denButton || !uploadButton || !downloadButton) {
    throw new Error("GFB-LB-03 requires the calibrated approved interface controls");
  }

  const helpButton = document.createElement("button");
  helpButton.className = "btn textBtn";
  helpButton.id = "helpBtn";
  helpButton.type = "button";
  helpButton.textContent = "Help";
  downloadButton.insertAdjacentElement("afterend", helpButton);

  const style = document.createElement("style");
  style.textContent = `
    .embeddedView{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(18px,4vw,38px);min-height:70vh}
    .embeddedView h1{margin-top:0}.indexTools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.indexTools input,.indexTools select{border:1px solid var(--line);background:#0b1525;color:var(--text);border-radius:10px;padding:10px 12px}.indexTools input{flex:1;min-width:220px}.indexCounts{color:var(--muted);font-size:13px;margin:8px 0 16px}.alphaAnchors{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.alphaAnchors a{color:var(--accent);text-decoration:none;font-weight:850}.indexHeaders,.indexSong{display:grid;grid-template-columns:minmax(0,1fr) 6rem;gap:16px}.indexHeaders{color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.08em;border-bottom:1px solid var(--line);padding:7px 9px}.indexHeaders span:last-child,.indexKey{text-align:right}.artistGroup{margin-top:22px}.artistGroup h2{font-size:18px;margin:0 0 6px}.indexSong{padding:8px 9px;border-radius:8px}.indexSong:hover{background:#142238}.indexSong a{color:var(--text);text-decoration:none}.indexKey{color:var(--muted);font-weight:800}.helpGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.helpCard{border:1px solid var(--line);border-radius:12px;padding:15px;background:#0b1525}.helpCard h2{font-size:17px;margin:0 0 8px}.helpCard p{color:var(--muted);line-height:1.55;margin:0}.viewError{border:1px solid #b45b5b;background:#32191d;color:#ffd7d7;border-radius:10px;padding:14px}.backToGfb{margin-top:22px}.favoriteRow{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:6px;align-items:center;margin-bottom:4px}.favoriteRow .songItem{margin:0;min-width:0}.favoriteRemove{height:38px;border:1px solid #744153;border-radius:9px;background:#0b1525;color:#ff8399;font-weight:950}.favoriteRemove:hover,.favoriteRemove:focus{border-color:#ff8399;background:#291522;outline:none}
    @media(max-width:900px){.actions .textBtn{display:inline-flex!important;padding:8px 9px;font-size:12px;line-height:1}.actions{flex-wrap:wrap;justify-content:flex-end}}
    @media(max-width:600px){.embeddedView{padding:16px}.indexHeaders,.indexSong{grid-template-columns:minmax(0,1fr) 4rem}.indexTools{display:grid}.indexTools input{min-width:0;width:100%}}
  `;
  document.head.append(style);

  const panel = document.createElement("section");
  panel.id = "embeddedView";
  panel.className = "embeddedView hidden";
  main.append(panel);

  function escapeText(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function setSongViews(hidden) {
    songViews.forEach(node => node.classList.toggle("hidden", hidden));
    if (toolbar) toolbar.classList.toggle("hidden", hidden);
    panel.classList.toggle("hidden", !hidden);
  }

  function setHeaderMode(mode) {
    indexButton.classList.toggle("active", mode === "index");
    libraryButton.classList.toggle("active", mode === "library");
    denButton.classList.toggle("active", mode === "den");
    helpButton.classList.toggle("active", mode === "help");
    newSongButton.classList.toggle("hidden", mode !== "den");
  }

  function showLibrary() {
    setSongViews(false);
    setHeaderMode("library");
  }

  function showArtistDen() {
    panel.classList.add("hidden");
    document.querySelector(".songHero")?.classList.remove("hidden");
    document.querySelector(".sheet")?.classList.remove("hidden");
    document.querySelector(".mobileSongs")?.classList.remove("hidden");
    document.querySelector(".chordRail")?.classList.add("hidden");
    if (toolbar) toolbar.classList.remove("hidden");
    setHeaderMode("den");
  }

  function musicalKey(value) {
    const key = String(value || "").trim();
    if (!key || /^(gp3|gp4|gp5|gpx|alt)$/i.test(key)) return "—";
    return key;
  }

  async function loadIndex() {
    if (indexLoaded) return;
    const response = await fetch(`${dataBase}/index.json`, {cache:"no-store"});
    if (!response.ok) throw new Error(`index request returned HTTP ${response.status}`);
    const payload = await response.json();
    if (payload.schema !== "guitarfakebook.library-index.v1" || payload.count !== 10 || !Array.isArray(payload.songs)) {
      throw new Error("index response is not the authorized ten-song QA-0 catalog");
    }
    indexRows = payload.songs;
    indexLoaded = true;
  }

  function renderIndexRows() {
    const query = panel.querySelector("#indexSearch").value.trim().toLowerCase();
    const key = panel.querySelector("#indexKey").value;
    const visible = indexRows.filter(row => {
      const textMatch = !query || `${row.artist} ${row.displayTitle || row.title}`.toLowerCase().includes(query);
      const keyMatch = !key || musicalKey(row.key) === key;
      return textMatch && keyMatch;
    });
    const groups = new Map();
    visible.forEach(row => {
      if (!groups.has(row.artist)) groups.set(row.artist, []);
      groups.get(row.artist).push(row);
    });
    const artists = [...groups.keys()].sort((a,b) => a.localeCompare(b));
    panel.querySelector("#indexCounts").textContent = `${artists.length} artist${artists.length === 1 ? "" : "s"} • ${visible.length} song${visible.length === 1 ? "" : "s"}`;
    const letters = [...new Set(artists.map(artist => (/^[A-Z]/i.test(artist) ? artist[0].toUpperCase() : "#")))];
    panel.querySelector("#alphaAnchors").innerHTML = letters.map(letter => `<a href="#artist-${encodeURIComponent(letter)}">${escapeText(letter)}</a>`).join("");
    panel.querySelector("#indexResults").innerHTML = artists.map(artist => {
      const letter = /^[A-Z]/i.test(artist) ? artist[0].toUpperCase() : "#";
      const songs = groups.get(artist).map(row => {
        const href = `?song=${encodeURIComponent(row.id)}`;
        return `<div class="indexSong"><a data-song-id="${escapeText(row.id)}" href="${href}">${escapeText(row.displayTitle || row.title)}</a><span class="indexKey">${escapeText(musicalKey(row.key))}</span></div>`;
      }).join("");
      return `<section class="artistGroup" id="artist-${encodeURIComponent(letter)}"><h2>${escapeText(artist)}</h2>${songs}</section>`;
    }).join("") || '<div class="empty">No songs match both filters.</div>';
    panel.querySelectorAll("[data-song-id]").forEach(link => link.addEventListener("click", async event => {
      event.preventDefault();
      showLibrary();
      if (typeof gfbView !== "undefined") gfbView = "library";
      await selectSong(link.dataset.songId);
    }));
  }

  async function showIndex() {
    setSongViews(true);
    setHeaderMode("index");
    panel.innerHTML = '<h1>Index</h1><p>Browse the ten verified QA-0 songs by artist, song, and musical key.</p><div class="indexTools"><input id="indexSearch" type="search" placeholder="Search artist or song" aria-label="Search Index by artist or song"><select id="indexKey" aria-label="Filter Index by key"><option value="">All keys</option></select></div><div class="indexCounts" id="indexCounts">Loading…</div><nav class="alphaAnchors" id="alphaAnchors" aria-label="Artist initials"></nav><div class="indexHeaders"><span>SONG</span><span>KEY</span></div><div id="indexResults"></div>';
    try {
      await loadIndex();
      const keys = [...new Set(indexRows.map(row => musicalKey(row.key)))].sort();
      panel.querySelector("#indexKey").insertAdjacentHTML("beforeend", keys.map(key => `<option value="${escapeText(key)}">${escapeText(key)}</option>`).join(""));
      panel.querySelector("#indexSearch").addEventListener("input", renderIndexRows);
      panel.querySelector("#indexKey").addEventListener("change", renderIndexRows);
      renderIndexRows();
    } catch (error) {
      panel.innerHTML = `<h1>Index unavailable</h1><div class="viewError">The real QA-0 catalog could not be loaded: ${escapeText(error.message)}</div>`;
    }
  }

  function showHelp() {
    setSongViews(true);
    setHeaderMode("help");
    const cards = [
      ["Unlocking and sign-out", "This QA-only package has no account gate. On a future signed-in build, use the account control to unlock or sign out."],
      ["Library search", "Choose Library and type an artist or song. Open a result, then use the heart to save up to 50 favorites."],
      ["Index", "Choose Index to browse by artist, search artist or song, or combine search with the All keys filter."],
      ["Chords and positions", "Hover, focus, or tap a chord label. Use Previous and Next to move among verified neck positions."],
      ["Player controls", "Transpose changes the displayed key and chords. Font changes readability. Autoscroll, Slower, Faster, and Print support rehearsal and performance."],
      ["Backing Track and Lesson", "These buttons open focused YouTube searches for the selected Library song."],
      ["Editing and persistence", "Edits, favorites, font size, and Artist’s Den songs save automatically in this browser. Browser storage can be cleared, so keep backups."],
      ["Artist’s Den", "Create, edit, and delete up to 50 personal songs. Artist’s Den has no favorites, chord boxes, Backing Track, or Lesson."],
      ["Upload and Download", "Library preferences and Artist’s Den backups are separate formats and cannot be substituted for one another."],
      ["Move between devices", "Download the correct backup on one phone, iPad, or desktop, then Upload that same file type on the other device."],
      ["Gig preparation", "Open each needed song, save favorites, set font and scroll speed, and download backups before leaving reliable internet."],
      ["Storage and backups", "Browser storage is device-specific and may be erased by browser cleanup or private mode. Download regular backups."]
    ];
    panel.innerHTML = `<h1>Help</h1><p>Direct instructions for using GuitarFakeBook.</p><div class="helpGrid">${cards.map(([title,body]) => `<section class="helpCard"><h2>${escapeText(title)}</h2><p>${escapeText(body)}</p></section>`).join("")}</div><button class="btn primary backToGfb" id="backToGfb" type="button">Back to GuitarFakeBook</button>`;
    panel.querySelector("#backToGfb").addEventListener("click", () => libraryButton.click());
  }

  indexButton.addEventListener("click", event => { event.preventDefault(); showIndex(); });
  helpButton.addEventListener("click", showHelp);
  libraryButton.addEventListener("click", showLibrary);
  denButton.addEventListener("click", showArtistDen);

  const params = new URLSearchParams(location.search);
  if (params.get("view") === "index" || location.hash === "#index") showIndex();
  else if (params.get("view") === "help" || location.hash === "#help") showHelp();
})();

</script>
</body>
